<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>王孟祁 - 個人網站</title>
    <style>
        body {
            margin: 0;
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            background-color: #f7f6f0;
            color: #333333;
        }
        header {
            background-color: #004d40;
            color: #ffffff;
            text-align: center;
            padding: 40px 20px;
        }
        header h1 {
            margin: 0 0 10px 0;
            font-size: 2rem;
        }
        header p {
            margin: 0;
            font-size: 1rem;
            opacity: 0.9;
        }
        .container {
            max-width: 800px;
            margin: 30px auto;
            padding: 0 20px;
        }
        .card {
            background-color: #ffffff;
            border-radius: 8px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .card h2 {
            color: #004d40;
            margin-top: 0;
            font-size: 1.25rem;
        }
        .card p {
            line-height: 1.6;
            margin-bottom: 0;
        }
        ul {
            padding-left: 20px;
            margin-bottom: 0;
        }
        li {
            margin-bottom: 8px;
        }
        a {
            color: #4f46e5;
            text-decoration: underline;
        }
        footer {
            text-align: center;
            color: #777777;
            font-size: 0.9rem;
            padding: 20px 0 40px 0;
        }

</head>
<body>

    <header>
        <h1>你好，我是王孟祁</h1>
        <p>亞洲大學 | 網站系統建置與規劃</p>

    <div class="container">
        <!-- 第一欄：關於我 -->
        <div class="card">
            <h2>關於我</h2>
            <p>這是我放上網路的第一個網頁。原本只能在自己的電腦開啟，現在任何人輸入網址都看得到。</p>
        </div>

        <!-- 第二欄：我的作品 -->
        <div class="card">
            <h2>我的作品</h2>
            <ul>
                <li><a href="works.html">作品清單</a></li>
                <li>第 3 週：Bootstrap 響應式首頁</li>
            </ul>
        </div>
    </div>

    <footer>
        最後更新：2026年10月
    </footer>
